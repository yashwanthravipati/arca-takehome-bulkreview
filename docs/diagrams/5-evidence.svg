<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img">
  <title>The evidence chain for one answer: the answer is split into claims, each claim has quotes, each quote is located as a span of characters in the stored text, the span falls on a page, and the same span is highlighted in the evidence view. Three checks guard the chain: every list item has a claim, each claim has a quote that holds its key fact, and each quote is found in the text. Any failed check sends the cell to needs review.</title>
  <style>
    svg { --bg: #ffffff; --fg: #19212b; --muted: #586474; --line: #c4ccd6; --edge: #78849a;
      --node: #ffffff; --panel: #eef1f5; --accent: #0a7782; --accent-soft: #ddf0f1;
      --ok: #2b7650; --ok-soft: #e2f1e8; --warn: #a3620a; --warn-soft: #fbefda;
      --bad: #b3372b; --bad-soft: #f8e2df;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e1e7ee; --muted: #93a0b0; --line: #354150; --edge: #7e8a9b;
        --node: #161d26; --panel: #121921; --accent: #47b8c3; --accent-soft: #123137;
        --ok: #5ec48f; --ok-soft: #13301f; --warn: #e2a64b; --warn-soft: #33250e;
        --bad: #ef7b6e; --bad-soft: #3a1915; }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .t { font-size: 13px; font-weight: 600; }
    .tm { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .lbl { font-size: 11px; fill: var(--muted); }
    .lbl.hot, .hot-text { fill: var(--accent); font-weight: 500; }
    .node { fill: var(--node); stroke: var(--line); stroke-width: 1.2; }
    .group { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .hotbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
    .okbox { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.3; }
    .warnbox { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.3; }
    .badbox { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.3; }
    .band { fill: var(--accent-soft); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
    .edge.hot { stroke: var(--accent); stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    .dots { stroke-dasharray: 2 3; }
    .ah { fill: var(--edge); }
    .ah.hot { fill: var(--accent); }
    .ink { fill: var(--fg); }
    .accent-fill { fill: var(--accent); }
    .bad-fill { fill: var(--bad); }
    .gate { fill: var(--node); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <rect class="bg" width="1000" height="270"/>
  <defs>
    <marker id="f5a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>

  <path class="edge" d="M155,75 H182" marker-end="url(#f5a)"/>
  <path class="edge" d="M320,75 H347" marker-end="url(#f5a)"/>
  <path class="edge" d="M485,75 H512" marker-end="url(#f5a)"/>
  <path class="edge" d="M650,75 H677" marker-end="url(#f5a)"/>
  <path class="edge" d="M815,75 H842" marker-end="url(#f5a)"/>

  <rect class="node" x="20" y="36" width="135" height="78" rx="8"/>
  <text class="t" x="30" y="58">Answer</text>
  <text class="m" x="30" y="80">Long-term storage</text>
  <text class="m" x="30" y="97">at 25°C ± 2°C …</text>
  <rect class="node" x="185" y="36" width="135" height="78" rx="8"/>
  <text class="t" x="195" y="58">Claim 1 of 5</text>
  <text class="m" x="195" y="80">stored at 25°C</text>
  <text class="m" x="195" y="97">± 2°C / 60% RH</text>
  <rect class="node" x="350" y="36" width="135" height="78" rx="8"/>
  <text class="t" x="360" y="58">Quote</text>
  <text class="m" x="360" y="80">“Ongoing batches</text>
  <text class="m" x="360" y="97">are stored at …”</text>
  <rect class="node" x="515" y="36" width="135" height="78" rx="8"/>
  <text class="t" x="525" y="58">Text span</text>
  <text class="m" x="525" y="80">chars 7,618–7,676</text>
  <text class="m" x="525" y="97">exact match</text>
  <rect class="node" x="680" y="36" width="135" height="78" rx="8"/>
  <text class="t" x="690" y="58">Page</text>
  <text class="m" x="690" y="80">page 3 of 8</text>
  <text class="m" x="690" y="97">from ingestion</text>
  <rect class="hotbox" x="845" y="36" width="135" height="78" rx="8"/>
  <text class="t" x="855" y="58">Highlight</text>
  <text class="m" x="855" y="80">evidence view,</text>
  <text class="m" x="855" y="97">tagged claim 1</text>

  <!-- checks -->
  <circle class="gate" cx="170" cy="75" r="9"/>
  <text class="m hot-text" x="170" y="79" text-anchor="middle">1</text>
  <circle class="gate" cx="335" cy="75" r="9"/>
  <text class="m hot-text" x="335" y="79" text-anchor="middle">2</text>
  <circle class="gate" cx="500" cy="75" r="9"/>
  <text class="m hot-text" x="500" y="79" text-anchor="middle">3</text>
  <path class="edge dots" d="M170,84 V138"/>
  <path class="edge dots" d="M335,84 V138"/>
  <path class="edge dots" d="M500,84 V138"/>
  <text class="lbl" x="170" y="152" text-anchor="middle">every list item</text>
  <text class="lbl" x="170" y="167" text-anchor="middle">has its own claim</text>
  <text class="lbl" x="335" y="152" text-anchor="middle">a quote holds the</text>
  <text class="lbl" x="335" y="167" text-anchor="middle">key fact (support check)</text>
  <text class="lbl" x="500" y="152" text-anchor="middle">quote found in the text:</text>
  <text class="lbl" x="500" y="167" text-anchor="middle">exact, else fuzzy ≥ 95</text>

  <path class="edge dash" d="M170,176 V205" marker-end="url(#f5a)"/>
  <path class="edge dash" d="M335,176 V205" marker-end="url(#f5a)"/>
  <path class="edge dash" d="M500,176 V205" marker-end="url(#f5a)"/>
  <rect class="warnbox" x="100" y="208" width="470" height="40" rx="8"/>
  <text class="t" x="335" y="233" text-anchor="middle">needs review: a person checks it in the evidence view</text>

  <text class="lbl" x="680" y="152">The page and the highlight use the offsets</text>
  <text class="lbl" x="680" y="167">stored at ingestion: nothing is matched again.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img">
  <title>A cell goes through six steps: claim, answer, verify, check, status, write. Throttled calls go back to the queue without using an attempt; other errors are retried up to three attempts; a worker that lost its lease drops its result. Example: STAB-015 storage condition, claim 1, quote found at characters 7,618 to 7,676 on page 3, key fact confirmed, cell marked needs review because one of five claims failed the check.</title>
  <style>
    svg { --bg: #ffffff; --fg: #19212b; --muted: #586474; --line: #c4ccd6; --edge: #78849a;
      --node: #ffffff; --panel: #eef1f5; --accent: #0a7782; --accent-soft: #ddf0f1;
      --ok: #2b7650; --ok-soft: #e2f1e8; --warn: #a3620a; --warn-soft: #fbefda;
      --bad: #b3372b; --bad-soft: #f8e2df;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e1e7ee; --muted: #93a0b0; --line: #354150; --edge: #7e8a9b;
        --node: #161d26; --panel: #121921; --accent: #47b8c3; --accent-soft: #123137;
        --ok: #5ec48f; --ok-soft: #13301f; --warn: #e2a64b; --warn-soft: #33250e;
        --bad: #ef7b6e; --bad-soft: #3a1915; }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .t { font-size: 13px; font-weight: 600; }
    .tm { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .lbl { font-size: 11px; fill: var(--muted); }
    .lbl.hot, .hot-text { fill: var(--accent); font-weight: 500; }
    .node { fill: var(--node); stroke: var(--line); stroke-width: 1.2; }
    .group { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .hotbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
    .okbox { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.3; }
    .warnbox { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.3; }
    .badbox { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.3; }
    .band { fill: var(--accent-soft); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
    .edge.hot { stroke: var(--accent); stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    .dots { stroke-dasharray: 2 3; }
    .ah { fill: var(--edge); }
    .ah.hot { fill: var(--accent); }
    .ink { fill: var(--fg); }
    .accent-fill { fill: var(--accent); }
    .bad-fill { fill: var(--bad); }
    .gate { fill: var(--node); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <rect class="bg" width="1000" height="250"/>
  <defs>
    <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>

  <!-- exits -->
  <text class="lbl" x="259" y="20" text-anchor="middle">throttled (429/529): back to the queue, attempt kept</text>
  <text class="lbl" x="259" y="36" text-anchor="middle">other errors: retried, failed after 3 attempts</text>
  <path class="edge dash" d="M259,70 V46" marker-end="url(#f2a)"/>
  <text class="lbl" x="912" y="36" text-anchor="middle">lease lost: result dropped</text>
  <path class="edge dash" d="M923,70 V46" marker-end="url(#f2a)"/>

  <!-- step arrows -->
  <path class="edge" d="M166,105 H183" marker-end="url(#f2a)"/>
  <path class="edge" d="M332,105 H349" marker-end="url(#f2a)"/>
  <path class="edge" d="M498,105 H515" marker-end="url(#f2a)"/>
  <path class="edge" d="M664,105 H681" marker-end="url(#f2a)"/>
  <path class="edge" d="M830,105 H847" marker-end="url(#f2a)"/>

  <!-- steps -->
  <rect class="node" x="20" y="70" width="146" height="70" rx="8"/>
  <text class="t" x="32" y="92">1 · Claim</text>
  <text class="s" x="32" y="111">first unfinished</text>
  <text class="s" x="32" y="127">cell of a document</text>
  <rect class="node" x="186" y="70" width="146" height="70" rx="8"/>
  <text class="t" x="198" y="92">2 · Answer</text>
  <text class="s" x="198" y="111">Haiku, doc cached</text>
  <text class="s" x="198" y="127">→ claims + quotes</text>
  <rect class="node" x="352" y="70" width="146" height="70" rx="8"/>
  <text class="t" x="364" y="92">3 · Verify</text>
  <text class="s" x="364" y="111">find each quote:</text>
  <text class="s" x="364" y="127">exact or fuzzy ≥ 95</text>
  <rect class="node" x="518" y="70" width="146" height="70" rx="8"/>
  <text class="t" x="530" y="92">4 · Check</text>
  <text class="s" x="530" y="111">quotes hold each</text>
  <text class="s" x="530" y="127">claim's key fact?</text>
  <rect class="node" x="684" y="70" width="146" height="70" rx="8"/>
  <text class="t" x="696" y="92">5 · Status</text>
  <text class="s" x="696" y="111">done, needs review</text>
  <text class="s" x="696" y="127">or not found</text>
  <rect class="node" x="850" y="70" width="146" height="70" rx="8"/>
  <text class="t" x="862" y="92">6 · Write</text>
  <text class="s" x="862" y="111">one transaction,</text>
  <text class="s" x="862" y="127">if still the claimant</text>

  <!-- example: what moves through the steps -->
  <path class="edge dots" d="M93,140 V166"/>
  <path class="edge dots" d="M259,140 V166"/>
  <path class="edge dots" d="M425,140 V166"/>
  <path class="edge dots" d="M591,140 V166"/>
  <path class="edge dots" d="M757,140 V166"/>
  <path class="edge dots" d="M923,140 V166"/>
  <rect class="hotbox" x="20" y="168" width="146" height="52" rx="6"/>
  <text class="m" x="30" y="189">cell 263676</text>
  <text class="m" x="30" y="207">lease 30 s</text>
  <rect class="hotbox" x="186" y="168" width="146" height="52" rx="6"/>
  <text class="m" x="196" y="189">claim 1: long-term</text>
  <text class="m" x="196" y="207">25°C / 60% RH</text>
  <rect class="hotbox" x="352" y="168" width="146" height="52" rx="6"/>
  <text class="m" x="362" y="189">chars 7,618–7,676</text>
  <text class="m" x="362" y="207">page 3, exact</text>
  <rect class="hotbox" x="518" y="168" width="146" height="52" rx="6"/>
  <text class="m" x="528" y="189">✓ key fact is in</text>
  <text class="m" x="528" y="207">the quote</text>
  <rect class="hotbox" x="684" y="168" width="146" height="52" rx="6"/>
  <text class="m" x="694" y="189">4 of 5 claims ✓</text>
  <text class="m" x="694" y="207">→ needs review</text>
  <rect class="hotbox" x="850" y="168" width="146" height="52" rx="6"/>
  <text class="m" x="860" y="189">cell + 8 quotes</text>
  <text class="m" x="860" y="207">one commit</text>
  <text class="lbl hot" x="20" y="242">Example: STAB-015, storage condition (review 27)</text>
</svg>

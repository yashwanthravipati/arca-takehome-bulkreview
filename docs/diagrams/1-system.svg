<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img">
  <title>System overview. The corpus is loaded by ingest.py into Postgres. The web UI talks only to the API, which reads and writes Postgres and never calls the model. Worker processes claim cells from Postgres with a lease, call Claude for the answer and the support check, and write results back only if they still hold the lease.</title>
  <style>
    svg { --bg: #ffffff; --fg: #19212b; --muted: #586474; --line: #c4ccd6; --edge: #78849a;
      --node: #ffffff; --panel: #eef1f5; --accent: #0a7782; --accent-soft: #ddf0f1;
      --ok: #2b7650; --ok-soft: #e2f1e8; --warn: #a3620a; --warn-soft: #fbefda;
      --bad: #b3372b; --bad-soft: #f8e2df;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e1e7ee; --muted: #93a0b0; --line: #354150; --edge: #7e8a9b;
        --node: #161d26; --panel: #121921; --accent: #47b8c3; --accent-soft: #123137;
        --ok: #5ec48f; --ok-soft: #13301f; --warn: #e2a64b; --warn-soft: #33250e;
        --bad: #ef7b6e; --bad-soft: #3a1915; }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .t { font-size: 13px; font-weight: 600; }
    .tm { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .lbl { font-size: 11px; fill: var(--muted); }
    .lbl.hot, .hot-text { fill: var(--accent); font-weight: 500; }
    .node { fill: var(--node); stroke: var(--line); stroke-width: 1.2; }
    .group { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .hotbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
    .okbox { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.3; }
    .warnbox { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.3; }
    .badbox { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.3; }
    .band { fill: var(--accent-soft); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
    .edge.hot { stroke: var(--accent); stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    .dots { stroke-dasharray: 2 3; }
    .ah { fill: var(--edge); }
    .ah.hot { fill: var(--accent); }
    .ink { fill: var(--fg); }
    .accent-fill { fill: var(--accent); }
    .bad-fill { fill: var(--bad); }
    .gate { fill: var(--node); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <rect class="bg" width="1000" height="410"/>
  <defs>
    <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="f1h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="ah hot" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>

  <!-- edges -->
  <path class="edge" d="M240,52 H377" marker-end="url(#f1a)"/>
  <text class="lbl" x="309" y="44" text-anchor="middle">create review · rerun</text>
  <path class="edge" d="M380,74 H243" marker-end="url(#f1a)"/>
  <text class="lbl" x="309" y="91" text-anchor="middle">live cells (SSE)</text>
  <path class="edge" d="M465,94 V157" marker-end="url(#f1a)"/>
  <text class="lbl" x="457" y="131" text-anchor="end">pending cells</text>
  <path class="edge" d="M505,160 V97" marker-end="url(#f1a)"/>
  <text class="lbl" x="513" y="131">grid · totals</text>
  <path class="edge" d="M135,312 V254" marker-end="url(#f1a)"/>
  <text class="lbl" x="145" y="288">load</text>
  <path class="edge" d="M240,219 H343" marker-end="url(#f1a)"/>
  <text class="lbl" x="291" y="237" text-anchor="middle">text + offsets</text>
  <path class="edge hot" d="M780,301 H628" marker-end="url(#f1h)"/>
  <text class="lbl hot" x="704" y="292" text-anchor="middle">claim · 30 s lease</text>
  <path class="edge hot" d="M780,321 H628" marker-end="url(#f1h)"/>
  <text class="lbl hot" x="704" y="340" text-anchor="middle">write if still owner</text>
  <path class="edge" d="M875,269 V97" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
  <text class="lbl" x="866" y="172" text-anchor="end">answer (document cached)</text>
  <text class="lbl" x="866" y="188" text-anchor="end">support check</text>

  <!-- web, api, claude -->
  <rect class="node" x="30" y="30" width="210" height="64" rx="8"/>
  <text class="t" x="46" y="56">Web UI</text>
  <text class="s" x="46" y="76">grid · drawer · evidence view</text>
  <rect class="node" x="380" y="30" width="210" height="64" rx="8"/>
  <text class="t" x="396" y="56">API (FastAPI)</text>
  <text class="s" x="396" y="76">never calls the model</text>
  <rect class="node" x="780" y="30" width="190" height="64" rx="8"/>
  <text class="t" x="796" y="56">Claude API</text>
  <text class="s" x="796" y="76">Haiku 5.5 · prompt cache</text>

  <!-- corpus, ingest -->
  <rect class="node" x="30" y="187" width="210" height="64" rx="8"/>
  <text class="tm" x="46" y="213">ingest.py</text>
  <text class="s" x="46" y="233">text, page &amp; line offsets</text>
  <rect class="node" x="30" y="312" width="210" height="64" rx="8"/>
  <text class="t" x="46" y="338">Corpus</text>
  <text class="s" x="46" y="358">Markdown with page markers</text>

  <!-- postgres -->
  <rect class="group" x="330" y="160" width="310" height="236" rx="10"/>
  <text class="t" x="346" y="184">Postgres</text>
  <rect class="node" x="346" y="200" width="278" height="38" rx="6"/>
  <text class="tm" x="358" y="215">documents · pages</text>
  <text class="s" x="358" y="230">stored text, page + line offsets</text>
  <rect class="node" x="346" y="246" width="278" height="38" rx="6"/>
  <text class="tm" x="358" y="261">reviews · columns</text>
  <text class="s" x="358" y="276">the questions of each review</text>
  <rect class="hotbox" x="346" y="292" width="278" height="38" rx="6"/>
  <text class="tm" x="358" y="307">cells</text>
  <text class="s" x="358" y="322">the queue and the results</text>
  <rect class="node" x="346" y="338" width="278" height="38" rx="6"/>
  <text class="tm" x="358" y="353">citations</text>
  <text class="s" x="358" y="368">quote → characters → page</text>

  <!-- workers: stacked to show several processes -->
  <rect class="node" x="788" y="271" width="190" height="64" rx="8"/>
  <rect class="node" x="784" y="275" width="190" height="64" rx="8"/>
  <rect class="hotbox" x="780" y="279" width="190" height="64" rx="8"/>
  <text class="t" x="796" y="305">Workers × N</text>
  <text class="s" x="796" y="325">claim cells, call Claude</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img">
  <title>Left: a grid of six documents by six questions during a run with four workers. Each worker is on a different document, and each document's questions run in order, so at most one cell per document is running. Right: before, a document's second question ran only after every document's first question, which past about 1,900 documents takes longer than the 5-minute cache. Now a document's six questions run back to back in about 13 seconds, all inside the cache lifetime.</title>
  <style>
    svg { --bg: #ffffff; --fg: #19212b; --muted: #586474; --line: #c4ccd6; --edge: #78849a;
      --node: #ffffff; --panel: #eef1f5; --accent: #0a7782; --accent-soft: #ddf0f1;
      --ok: #2b7650; --ok-soft: #e2f1e8; --warn: #a3620a; --warn-soft: #fbefda;
      --bad: #b3372b; --bad-soft: #f8e2df;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e1e7ee; --muted: #93a0b0; --line: #354150; --edge: #7e8a9b;
        --node: #161d26; --panel: #121921; --accent: #47b8c3; --accent-soft: #123137;
        --ok: #5ec48f; --ok-soft: #13301f; --warn: #e2a64b; --warn-soft: #33250e;
        --bad: #ef7b6e; --bad-soft: #3a1915; }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .t { font-size: 13px; font-weight: 600; }
    .tm { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .lbl { font-size: 11px; fill: var(--muted); }
    .lbl.hot, .hot-text { fill: var(--accent); font-weight: 500; }
    .node { fill: var(--node); stroke: var(--line); stroke-width: 1.2; }
    .group { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .hotbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
    .okbox { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.3; }
    .warnbox { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.3; }
    .badbox { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.3; }
    .band { fill: var(--accent-soft); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
    .edge.hot { stroke: var(--accent); stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    .dots { stroke-dasharray: 2 3; }
    .ah { fill: var(--edge); }
    .ah.hot { fill: var(--accent); }
    .ink { fill: var(--fg); }
    .accent-fill { fill: var(--accent); }
    .bad-fill { fill: var(--bad); }
    .gate { fill: var(--node); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <rect class="bg" width="1000" height="330"/>
  <defs>
    <marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>

  <!-- left: a moment in a run -->
  <text class="t" x="20" y="36">A moment in a run with 4 workers</text>
  <text class="lbl" x="138" y="62" text-anchor="middle">Q1</text>
  <text class="lbl" x="182" y="62" text-anchor="middle">Q2</text>
  <text class="lbl" x="226" y="62" text-anchor="middle">Q3</text>
  <text class="lbl" x="270" y="62" text-anchor="middle">Q4</text>
  <text class="lbl" x="314" y="62" text-anchor="middle">Q5</text>
  <text class="lbl" x="358" y="62" text-anchor="middle">Q6</text>
  <text class="m" x="110" y="87" text-anchor="end">STAB-001</text>
  <text class="m" x="110" y="123" text-anchor="end">STAB-002</text>
  <text class="m" x="110" y="159" text-anchor="end">STAB-003</text>
  <text class="m" x="110" y="195" text-anchor="end">STAB-004</text>
  <text class="m" x="110" y="231" text-anchor="end">STAB-005</text>
  <text class="m" x="110" y="267" text-anchor="end">STAB-006</text>
  <!-- STAB-001: Q1-Q4 done, Q5 running -->
  <rect class="okbox" x="120" y="70" width="36" height="26" rx="4"/>
  <rect class="okbox" x="164" y="70" width="36" height="26" rx="4"/>
  <rect class="okbox" x="208" y="70" width="36" height="26" rx="4"/>
  <rect class="okbox" x="252" y="70" width="36" height="26" rx="4"/>
  <rect class="hotbox" x="296" y="70" width="36" height="26" rx="4"/>
  <text class="m hot-text" x="314" y="87" text-anchor="middle">W1</text>
  <rect class="node" x="340" y="70" width="36" height="26" rx="4"/>
  <!-- STAB-002: Q1-Q2 done, Q3 running -->
  <rect class="okbox" x="120" y="106" width="36" height="26" rx="4"/>
  <rect class="okbox" x="164" y="106" width="36" height="26" rx="4"/>
  <rect class="hotbox" x="208" y="106" width="36" height="26" rx="4"/>
  <text class="m hot-text" x="226" y="123" text-anchor="middle">W2</text>
  <rect class="node" x="252" y="106" width="36" height="26" rx="4"/>
  <rect class="node" x="296" y="106" width="36" height="26" rx="4"/>
  <rect class="node" x="340" y="106" width="36" height="26" rx="4"/>
  <!-- STAB-003, STAB-004: Q1 running -->
  <rect class="hotbox" x="120" y="142" width="36" height="26" rx="4"/>
  <text class="m hot-text" x="138" y="159" text-anchor="middle">W3</text>
  <rect class="node" x="164" y="142" width="36" height="26" rx="4"/>
  <rect class="node" x="208" y="142" width="36" height="26" rx="4"/>
  <rect class="node" x="252" y="142" width="36" height="26" rx="4"/>
  <rect class="node" x="296" y="142" width="36" height="26" rx="4"/>
  <rect class="node" x="340" y="142" width="36" height="26" rx="4"/>
  <rect class="hotbox" x="120" y="178" width="36" height="26" rx="4"/>
  <text class="m hot-text" x="138" y="195" text-anchor="middle">W4</text>
  <rect class="node" x="164" y="178" width="36" height="26" rx="4"/>
  <rect class="node" x="208" y="178" width="36" height="26" rx="4"/>
  <rect class="node" x="252" y="178" width="36" height="26" rx="4"/>
  <rect class="node" x="296" y="178" width="36" height="26" rx="4"/>
  <rect class="node" x="340" y="178" width="36" height="26" rx="4"/>
  <!-- STAB-005, STAB-006: waiting -->
  <rect class="node" x="120" y="214" width="36" height="26" rx="4"/>
  <rect class="node" x="164" y="214" width="36" height="26" rx="4"/>
  <rect class="node" x="208" y="214" width="36" height="26" rx="4"/>
  <rect class="node" x="252" y="214" width="36" height="26" rx="4"/>
  <rect class="node" x="296" y="214" width="36" height="26" rx="4"/>
  <rect class="node" x="340" y="214" width="36" height="26" rx="4"/>
  <rect class="node" x="120" y="250" width="36" height="26" rx="4"/>
  <rect class="node" x="164" y="250" width="36" height="26" rx="4"/>
  <rect class="node" x="208" y="250" width="36" height="26" rx="4"/>
  <rect class="node" x="252" y="250" width="36" height="26" rx="4"/>
  <rect class="node" x="296" y="250" width="36" height="26" rx="4"/>
  <rect class="node" x="340" y="250" width="36" height="26" rx="4"/>
  <!-- cache writes: each document's first question -->
  <circle class="accent-fill" cx="127" cy="77" r="3.5"/>
  <circle class="accent-fill" cx="127" cy="113" r="3.5"/>
  <circle class="accent-fill" cx="127" cy="149" r="3.5"/>
  <circle class="accent-fill" cx="127" cy="185" r="3.5"/>
  <!-- legend -->
  <rect class="okbox" x="20" y="292" width="14" height="12" rx="3"/>
  <text class="lbl" x="40" y="302">done</text>
  <rect class="hotbox" x="84" y="292" width="14" height="12" rx="3"/>
  <text class="lbl" x="104" y="302">running (W = worker)</text>
  <rect class="node" x="226" y="292" width="14" height="12" rx="3"/>
  <text class="lbl" x="246" y="302">waiting</text>
  <circle class="accent-fill" cx="27" cy="318" r="3.5"/>
  <text class="lbl" x="40" y="322">writes the document to the prompt cache; later questions read it</text>

  <!-- right: when the next question runs -->
  <text class="t" x="470" y="36">When does a document's next question run?</text>
  <text class="t" x="470" y="76">Column by column (before)</text>
  <rect class="band" x="480" y="96" width="240" height="20" rx="3"/>
  <text class="lbl hot" x="492" y="130">cached for 5 min</text>
  <path class="edge" d="M470,106 H985" marker-end="url(#f4a)"/>
  <circle class="accent-fill" cx="480" cy="106" r="5"/>
  <text class="lbl" x="480" y="90" text-anchor="middle">Q1</text>
  <circle class="bad-fill" cx="930" cy="106" r="5"/>
  <text class="lbl" x="930" y="90" text-anchor="middle">Q2</text>
  <text class="lbl" x="975" y="133" text-anchor="end">cache gone: written again</text>
  <path class="edge dots" d="M480,142 V150 H930 V142"/>
  <text class="lbl" x="705" y="167" text-anchor="middle">every document's Q1 runs in between: over 5 min past ~1,900 documents</text>

  <text class="t" x="470" y="206">Document by document (now)</text>
  <rect class="band" x="480" y="226" width="240" height="20" rx="3"/>
  <text class="lbl hot" x="566" y="262">cached for 5 min</text>
  <path class="edge" d="M470,236 H985" marker-end="url(#f4a)"/>
  <circle class="accent-fill" cx="480" cy="236" r="4.5"/>
  <circle class="accent-fill" cx="494" cy="236" r="4.5"/>
  <circle class="accent-fill" cx="508" cy="236" r="4.5"/>
  <circle class="accent-fill" cx="522" cy="236" r="4.5"/>
  <circle class="accent-fill" cx="536" cy="236" r="4.5"/>
  <circle class="accent-fill" cx="550" cy="236" r="4.5"/>
  <text class="lbl" x="480" y="220" text-anchor="middle">Q1</text>
  <text class="lbl" x="550" y="220" text-anchor="middle">Q6</text>
  <text class="lbl" x="470" y="288">all six back to back: about 13 s per document (measured, review 15)</text>
  <text class="lbl" x="470" y="306">one cache write per document: 15 of 15</text>
</svg>
